<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasdeeq: atta delivery proof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --paper:#EDF1EE; --surface:#FFFFFF; --sunk:#F5F7F5; --ink:#1B2A22; --muted:#56665D; --line:#D2DAD4;
  --green:#0E6B3D; --green-ink:#FFFFFF; --green-soft:#DCEEE3;
  --stamp:#4434A6; --amber:#8F5600; --amber-soft:#FBEFD9; --red:#B42318; --red-soft:#FCE4E1; --wheat:#C4952B;
  --scrim:rgba(14,24,18,.5);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101914; --surface:#17231C; --sunk:#1C2A22; --ink:#E5EDE7; --muted:#9AAEA2; --line:#2B3B32;
    --green:#4DB884; --green-ink:#08160E; --green-soft:#1C3527;
    --stamp:#ABA2FF; --amber:#E8A944; --amber-soft:#382A12; --red:#F27668; --red-soft:#3C1C19; --wheat:#DDB24E;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101914; --surface:#17231C; --sunk:#1C2A22; --ink:#E5EDE7; --muted:#9AAEA2; --line:#2B3B32;
  --green:#4DB884; --green-ink:#08160E; --green-soft:#1C3527;
  --stamp:#ABA2FF; --amber:#E8A944; --amber-soft:#382A12; --red:#F27668; --red-soft:#3C1C19; --wheat:#DDB24E;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.ur{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",serif;direction:rtl;unicode-bidi:isolate;line-height:2.1;font-weight:400}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px;border-radius:6px}
img{max-width:100%}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:56px}
.bar .back{border:0;background:none;padding:8px;margin-left:-6px;border-radius:8px;cursor:pointer;display:flex;align-items:center;color:var(--ink)}
.bar .back[hidden]{display:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:.01em;background:none;border:0;padding:0;cursor:pointer}
.seal{width:30px;height:30px;border:2.5px double var(--stamp);color:var(--stamp);border-radius:5px;display:grid;place-items:center;transform:rotate(-7deg);font-size:15px;line-height:1}
.seal span{font-family:"Noto Nastaliq Urdu",serif;transform:translateY(-3px)}
.mode{margin-left:auto;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mode.live{color:var(--green);border-color:var(--green)}
.mode.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}

main{max-width:640px;margin:0 auto;padding:18px 16px 56px}
main.wide{max-width:1040px}
h1{font-size:26px;line-height:1.2;margin:4px 0 6px}
h2{font-size:19px;margin:28px 0 10px}
h3{font-size:17px;margin:0}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{flex-wrap:wrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--green);background:var(--green);color:var(--green-ink);font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--green)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink);font-weight:400}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:15px}
.btn.block{display:flex;width:100%}
.btn .ur{font-size:.88em;line-height:1.6}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.linkbtn{background:none;border:0;padding:0;color:var(--green);text-decoration:underline;cursor:pointer;font-size:15px}

/* home */
.chain{list-style:none;margin:18px 0 8px;padding:0;display:grid;gap:0}
.chain li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;position:relative}
.chain li+li::before{content:"";position:absolute;left:16px;top:-6px;height:18px;border-left:2px dotted var(--line)}
.chain .muted{display:block;line-height:1.45;margin-top:3px}
.chain .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sunk);border:1.5px solid var(--line);font-size:15px}
.chain li:nth-child(2) .n{border:2.5px double var(--stamp);color:var(--stamp);background:transparent}
.roles{display:grid;gap:12px;margin-top:22px}
.role{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;width:100%}
.role:hover{border-color:var(--green)}
.role b{font-size:19px}
.role .ur{grid-column:1/2;color:var(--muted);font-size:15px;line-height:1.9;text-align:left}
.role .arrow{grid-row:1/3;grid-column:2;color:var(--green)}
.modenote{margin-top:22px;padding:12px 14px;border-left:4px solid var(--wheat);background:var(--surface);font-size:15px;border-radius:0 8px 8px 0}
.planline{font-size:15px;color:var(--muted);margin-top:4px}

/* forms */
.field{display:block;margin:14px 0}
.field>span{display:block;font-weight:700;margin-bottom:6px}
.input{width:100%;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:18px}
.input:focus{border-color:var(--green);outline:none}
textarea.input{min-height:80px}
.qty{display:flex;align-items:center;gap:10px;margin:8px 0}
.qty label{min-width:70px}
.qty input{width:120px;text-align:center;font-size:22px;font-weight:700}

/* lists */
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 2px;border-bottom:1px solid var(--line);align-items:start}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--sunk)}
.row .t{font-weight:700}
.row .s{font-size:14px;color:var(--muted)}
.row .acts{display:flex;flex-wrap:wrap;gap:14px;grid-column:1/-1;font-size:14px;margin-top:2px}
.row .acts a{color:var(--green)}
.row .side{text-align:right}
.bags{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.secthead{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 6px}
.secthead h2{margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.wait{background:var(--amber-soft);color:var(--amber)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.sim::before{display:none}
.chip.sim{background:transparent;border:1px dashed var(--line)}

/* progress */
.meter{height:12px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .c{background:var(--green)}
.meter .o{background:var(--wheat)}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.legend div{font-size:14px;color:var(--muted)}
.legend b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.legend .k{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}

/* slip (shop deliveries) */
.slip{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;position:relative}
.slip .from{font-size:14px;color:var(--muted)}
.slip h3{font-size:20px;margin:2px 0 8px}
.slip .photo{width:100%;max-height:260px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunk);display:block;margin:10px 0}
.slip .stampwrap{display:flex;justify-content:flex-end;margin-top:8px}
.pinbox{padding:14px 16px;border-radius:10px;margin:16px 0;border:1.5px dashed var(--line);background:var(--surface)}
.pinbox.done{border-style:solid;border-color:var(--green-soft)}

/* the stamp */
.stamp{display:inline-block;border:3.5px double var(--stamp);color:var(--stamp);padding:7px 14px 6px;transform:rotate(-5deg);text-transform:uppercase;letter-spacing:.09em;font-weight:700;border-radius:6px;line-height:1.15;text-align:center;font-size:18px}
.stamp small{display:block;font-size:12px;letter-spacing:.03em;text-transform:none;font-weight:400;margin-top:3px}
.stamp.bad{border-color:var(--red);color:var(--red)}
.stamp.land{animation:land .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes land{from{transform:rotate(-16deg) scale(1.9);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp.land{animation:none}}

/* board */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:10px 0 4px}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px;white-space:nowrap;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.panel h2{margin-top:0}
.grid2{display:grid;gap:14px}
@media (min-width:860px){.grid2{grid-template-columns:1.1fr .9fr}.grid2>.panel{margin-top:0}}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:inherit}
.flag{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.flag:last-child{border-bottom:0}
.flag .sev{width:10px;height:10px;border-radius:50%;margin-top:6px}
.sev3{background:var(--red)}.sev2{background:var(--amber)}.sev1{background:var(--muted)}
.millrow .meter{height:8px;margin-top:6px}
.millrow .side{min-width:104px}
.feed .row{grid-template-columns:auto 1fr auto}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:6px 0 4px;font-size:21px}
.sheet .close{float:right;border:0;background:var(--sunk);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:20px;line-height:1;color:var(--ink)}
.step{border-top:1px solid var(--line);padding:14px 0}
.step>b{display:block;margin-bottom:6px}
.shot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;border:2px dashed var(--line);border-radius:12px;cursor:pointer;background:var(--sunk);text-align:center;padding:12px;position:relative;overflow:hidden}
.shot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.shot img,.shot canvas{max-width:100%;max-height:240px;border-radius:8px}
.gps{font-size:15px}
.gps.ok{color:var(--green)}.gps.warn{color:var(--amber)}.gps.err{color:var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:6px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;z-index:60;max-width:min(92vw,520px);font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.empty{padding:22px 4px;color:var(--muted)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
</style>
</head>

  if (kind === "claude" && user && user.can) { try { canWrite = await user.can("data.write"); } catch (e) {} }
  if (db && canWrite !== false) {
    S.mode = "live"; S.kind = kind; S.db = db; S.user = user;
    if (kind === "claude") { try { S.canClear = user && user.canEdit ? await user.canEdit() : false; } catch (e) { S.canClear = false; } }
    else S.canClear = true;
    S.unsubs.push(db.collection("days/" + DAY + "/deliveries").onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); }); S.del = o; emit();
    }, err => { if (err && (err.code === "revoked" || err.code === "permission-denied")) goLocal("The shared ledger is no longer available here, so this phone is in demo mode now."); else toast("Live updates paused. Reload to reconnect."); }));
    S.unsubs.push(db.collection("shops").onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); }); S.pins = o; emit();
    }, () => {}));
  } else {
    S.mode = "local"; S.del = LS.get(K_DEL, {}); S.pins = LS.get(K_PINS, {});
    window.addEventListener("storage", e => {
      if (e.key === K_DEL) { S.del = LS.get(K_DEL, {}); emit(); }
      if (e.key === K_PINS) { S.pins = LS.get(K_PINS, {}); emit(); }

}
const TIMED_OUT = {};
async function liveWrite(p) {
  const r = await Promise.race([p, new Promise(res => setTimeout(() => res(TIMED_OUT), 12000))]);
  if (r === TIMED_OUT) toast("Weak signal: saved on this phone, it will sync when the connection returns. Keep this page open.");
}
function writeFailed(e) {
  if (e && e.code === "invalid_argument") { goLocal("This account can’t write to the shared ledger, so entries now stay on this phone."); return "retry"; }
  if (e && e.code === "permission-denied") { goLocal("The shared database refused the entry (its access rules may have expired), so entries now stay on this phone."); return "retry"; }
  if (e && e.code === "quota_exceeded") { toast("The shared ledger is full. Clear test data from the board."); return false; }
  toast("Couldn’t save (" + ((e && e.code) || "error") + "). Check the connection and try again.");
  return false;
}
async function saveDelivery(id, patch) {
  if (S.mode === "live") {
    const ref = S.db.doc("days/" + DAY + "/deliveries/" + id);
    if (S.kind === "firebase") {
      try { await liveWrite(ref.merge(Object.assign({id}, patch))); return true; }
      catch (e) { if (writeFailed(e) === "retry") return saveDelivery(id, patch); return false; }
    }
    try {
      const snap = await ref.get();
      if (snap.exists) await ref.update(patch); else await ref.set(Object.assign({id}, patch));
      return true;
    } catch (e) { if (writeFailed(e) === "retry") return saveDelivery(id, patch); return false; }
  }
  const cur = S.del[id] ? JSON.parse(JSON.stringify(S.del[id])) : {id};
  Object.assign(cur, patch);
  S.del = Object.assign({}, S.del, {[id]: cur});
  if (!LS.set(K_DEL, S.del)) toast("This phone’s storage is full; the entry is kept until you close the page.");
  emit(); return true;
}

    try { await liveWrite(S.db.doc("days/" + DAY + "/photos/" + id).set({img: dataUrl, at: Date.now()})); return true; }
    catch (e) { if (writeFailed(e) === "retry") return savePhoto(id, dataUrl); return false; }
  }

  return true;
}
async function getPhoto(id) {

  if (S.mode === "live") {
    try { const s = await S.db.doc("days/" + DAY + "/photos/" + id).get(); if (s.exists) { S.photos[id] = s.data().img; return S.photos[id]; } } catch (e) {}
    return null;

}

    try { await liveWrite(S.db.doc("shops/" + key).set(pin)); return true; }
    catch (e) { if (writeFailed(e) === "retry") return savePin(key, pin); return false; }

}
async function clearAll() {

let lastFix = null;
function getGPS(timeout) {
  return new Promise(res => {
    if (!navigator.geolocation) return res({err:"unsupported"});
    try {
      navigator.geolocation.getCurrentPosition(
        p => { lastFix = {lat:+p.coords.latitude.toFixed(6), lon:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy), at:Date.now()}; res(lastFix); },
        e => res({err: e.code === 1 ? "denied" : e.code === 3 ? "timeout" : "unavailable"}),
        {enableHighAccuracy:true, timeout: timeout || 15000, maximumAge:20000});
    } catch (e) { res({err:"unavailable"}); }
  });
}
const GPS_ERR = {denied:"Location permission is blocked for this page.", timeout:"Location took too long. Move into the open and retry.", unavailable:"This phone couldn’t get a location fix.", unsupported:"This browser can’t share location."};

/* ===== delivery state ===== */
function refFor(l) {
  const pin = S.pins[l.key];
  if (pin && pin.lat != null) return {lat:pin.lat, lon:pin.lon, kind:"pin"};
  if (l.lat != null) return {lat:l.lat, lon:l.lon, kind:"sheet"};
  return null;
}
function stateOf(l) {
  const d = S.del[l.id] || {};
  const o = d.offload || null, c = d.confirm || null;
  let st = "pending";
  if (c) st = (c.status === "short" || c.status === "none") ? "disputed" : "confirmed";
  else if (o) st = "offloaded";
  return {d, o, c, st};
}
function flagsFor(l) {
  const {o, c} = stateOf(l); const f = [];
  if (o) {
    if (!o.gps) f.push({sev:2, t:"Offload tagged without GPS"});
    else {
      const ref = refFor(l);
      if (ref) {
        const m = haversine(o.gps, ref);
        if (m > FAR_M) f.push({sev: ref.kind === "pin" ? 3 : 2, t:"Offloaded " + distText(m) + " from the " + (ref.kind === "pin" ? "shop’s own pin" : "sheet location")});
      }
    }
    if (!c && Date.now() - o.at > 2 * 3600e3) f.push({sev:1, t:"Shop hasn’t confirmed for " + Math.floor((Date.now() - o.at) / 3600e3) + "+ hours"});
  }
  if (c) {
    if (c.status === "none") f.push({sev:3, t:"Shop says nothing arrived"});
    else if (c.status === "short") f.push({sev:3, t:"Short receipt: " + fmt(c.total) + " of " + fmt(o ? o.total : l.total) + " bags"});
    if (!o) f.push({sev:2, t:"Shop received atta the mill never tagged"});
  }
  return f;
}
function chipFor(l) {
  const {o, c, st, d} = stateOf(l);
  const sim = d.sim ? ' <span class="chip sim">sample</span>' : "";
  if (st === "pending") return '<span class="chip">Not offloaded yet</span>' + sim;
  if (st === "offloaded") return '<span class="chip wait">Offloaded ' + tm(o.at) + ', waiting for shop</span>' + sim;
  if (st === "confirmed") return '<span class="chip ok">Shop confirmed ' + tm(c.at) + '</span>' + sim;
  return '<span class="chip bad">' + (c.status === "none" ? "Shop says not received" : "Shop received fewer") + '</span>' + sim;
}
function stampHtml(l, animate) {
  const {o, c} = stateOf(l); if (!c) return "";
  const bad = c.status === "short" || c.status === "none";
  const head = c.status === "none" ? "Not received" : bad ? "Received " + fmt(c.total) + " of " + fmt(o ? o.total : l.total) : "Received " + fmt(c.total) + " bags";
  return '<div class="stamp' + (bad ? " bad" : "") + (animate ? " land" : "") + '">' + esc(head) + '<small>' + esc(dtm(c.at)) + (c.untagged ? ", not tagged by mill" : "") + '</small></div>';
}
function totals(lines) {
  const t = {lines:lines.length, planned:0, off:0, conf:0, sPend:0, sOff:0, sConf:0, sDisp:0};
  for (const l of lines) {
    const {o, c, st} = stateOf(l);
    t.planned += l.total;
    if (o) t.off += o.total;
    if (c) t.conf += c.total;
    if (st === "pending") t.sPend++; else if (st === "offloaded") t.sOff++; else if (st === "confirmed") t.sConf++; else t.sDisp++;
  }
  return t;
}

async function loadPhoto(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, {imageOrientation:"from-image"}); } catch (e) {} }
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
}
function stampPhoto(img, lines) {
  const maxSide = 1100;
  let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const s = Math.min(1, maxSide / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.drawImage(img, 0, 0, w, h);
  const fs = Math.max(14, Math.round(w / 34)); const pad = Math.round(fs * .6); const band = fs * 2 + pad * 3;
  x.fillStyle = "rgba(0,0,0,.62)"; x.fillRect(0, h - band, w, band);
  x.fillStyle = "#fff"; x.textBaseline = "top";
  x.font = "700 " + fs + "px 'Atkinson Hyperlegible', sans-serif"; x.fillText(lines[0], pad, h - band + pad, w - pad * 2);
  x.font = "400 " + fs + "px 'Atkinson Hyperlegible', sans-serif"; x.fillText(lines[1], pad, h - band + pad * 2 + fs, w - pad * 2);
  let q = .62, out = c.toDataURL("image/jpeg", q);
  while (out.length > 190000 && q > .3) { q -= .08; out = c.toDataURL("image/jpeg", q); }
  if (out.length > 190000) { const c2 = document.createElement("canvas"); c2.width = Math.round(w * .7); c2.height = Math.round(h * .7); c2.getContext("2d").drawImage(c, 0, 0, c2.width, c2.height); out = c2.toDataURL("image/jpeg", .55); }
  return out;
}

function hourChart(offs) {
  if (!offs.length) return '<p class="empty">No offloads tagged yet. This chart shows, hour by hour, how many bags actually reached shops.</p>';
  const H0 = 6, H1 = 23; const bins = new Array(H1 - H0 + 1).fill(0);
  let total = 0; const sorted = offs.map(x => x.o).sort((a, b) => a.at - b.at);
  sorted.forEach(o => { const h = Math.min(H1, Math.max(H0, new Date(o.at).getHours())); bins[h - H0] += o.total; total += o.total; });
  let acc = 0, median = null; for (const o of sorted) { acc += o.total; if (acc >= total / 2) { median = o.at; break; } }
  const max = Math.max(...bins), W = 360, Hh = 130, bw = W / bins.length;
  const bars = bins.map((v, i) => { const h = max ? Math.round((v / max) * (Hh - 26)) : 0; return `<rect x="${(i * bw + 2).toFixed(1)}" y="${Hh - 16 - h}" width="${(bw - 4).toFixed(1)}" height="${h}" rx="2" fill="var(--wheat)"><title>${fmt(v)} bags between ${hl(i + H0)} and ${hl(i + H0 + 1)}</title></rect>`; }).join("");
  const labels = bins.map((v, i) => (i + H0) % 3 === 0 ? `<text x="${(i * bw + bw / 2).toFixed(1)}" y="${Hh - 3}" text-anchor="middle">${hl(i + H0)}</text>` : "").join("");
  const late = sorted.filter(o => new Date(o.at).getHours() >= 18).reduce((a, o) => a + o.total, 0);
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Bags offloaded per hour">${bars}<line x1="0" y1="${Hh - 16}" x2="${W}" y2="${Hh - 16}" stroke="var(--line)"/>${labels}</svg>
    <p class="small" style="margin-top:10px">First offload at <b>${tm(sorted[0].at)}</b>. Half of the tagged bags had landed by <b>${tm(median)}</b>; the latest at <b>${tm(sorted[sorted.length - 1].at)}</b>.${late ? " " + fmt(late) + " bags (" + pct(late, total) + "%) arrived after 6\u00a0pm." : ""}</p>`;
}

    const dm = o && o.gps && ref ? Math.round(haversine(o.gps, ref)) : "";
    return [l.id, l.dist, l.mill, l.shop, l.person, l.ph ? "0" + l.ph : "", l.addr, l.teh, l.zone, l.b10, l.b20, l.b15, st,
      o ? new Date(o.at).toISOString() : "", o ? o.total : "", o && o.gps ? o.gps.lat : "", o && o.gps ? o.gps.lon : "", o && o.gps ? o.gps.acc : "", dm, ref ? ref.kind : "", o ? (o.photo ? "yes" : "no") : "",
      c ? new Date(c.at).toISOString() : "", c ? c.total : "", c ? c.status : "", flagsFor(l).map(f => f.t).join("; "), d.sim ? "yes" : ""].map(q).join(",");
  });
  const csv = "\ufeff" + head.join(",") + "\n" + rows.join("\n");
  const filename = "tasdeeq-ledger-" + DAY + (V.dist === "All" ? "" : "-" + V.dist.toLowerCase().replace(/\s+/g, "-")) + ".csv";
  if (S.downloads) { S.downloads.save({filename, data:csv}).then(() => {}, e => { if (e && e.code !== "declined") toast("Download unavailable here (" + (e.code || "error") + ")."); }); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function simulate() {
  const lines = boardLines().filter(l => !S.del[l.id]);
  const hours = [9,10,10,11,11,12,12,13,13,13,14,14,14,15,15,16,16,17,17,18,18,19,20,21];
  const day = DAY.split("-").map(Number);
  const jitter = (p, m) => ({lat:+(p.lat + (Math.random() - .5) * m / 111000 * 2).toFixed(6), lon:+(p.lon + (Math.random() - .5) * m / 95000 * 2).toFixed(6)});
  const centre = {Lahore:{lat:31.52, lon:74.35}, Sheikhupura:{lat:31.71, lon:73.98}, "Nankana Sahib":{lat:31.45, lon:73.70}, Kasur:{lat:31.12, lon:74.45}};
  const del = Object.assign({}, S.del), pins = Object.assign({}, S.pins); let n = 0;
  for (const l of lines) {
    if (Math.random() > .62) continue; n++;
    const at = new Date(day[0], day[1] - 1, day[2], hours[Math.floor(Math.random() * hours.length)], Math.floor(Math.random() * 60)).getTime();
    const base = pins[l.key] ? {lat:pins[l.key].lat, lon:pins[l.key].lon} : l.lat != null ? {lat:l.lat, lon:l.lon} : jitter(centre[l.dist], 6000);
    if (!pins[l.key] && Math.random() < .45 && !l.cash) pins[l.key] = Object.assign(jitter(base, 30), {acc:12, at:at - 86400e3, sim:true});
    const far = Math.random() < .05, nogps = Math.random() < .04;
    const total = Math.random() < .08 ? Math.max(0, l.total - 10 * (1 + Math.floor(Math.random() * 3))) : l.total;
    const o = {at, b10: l.b10 ? total - l.b20 - l.b15 : 0, b20:l.b20, b15:l.b15, total, gps: nogps ? null : Object.assign(jitter(base, far ? 2400 : 60), {acc: 8 + Math.floor(Math.random() * 25)}), gpsErr: nogps ? "denied" : null, photo:false};
    if (o.b10 < 0) { o.b10 = 0; }
    const rec = {id:l.id, sim:true, offload:o};
    const r = Math.random();
    if (r < .8 && !l.cash) {
      const cat = at + (10 + Math.random() * 90) * 60000;
      const status = Math.random() < .06 ? "short" : Math.random() < .02 ? "none" : "ok";
      const got = status === "none" ? 0 : status === "short" ? Math.max(0, total - 10 * (1 + Math.floor(Math.random() * 3))) : total;
      rec.confirm = {at:cat, b10: l.b10 ? Math.max(0, got - l.b20 - l.b15) : 0, b20: status === "ok" ? l.b20 : 0, b15: status === "ok" ? l.b15 : (l.b10 ? 0 : got), total:got, status, untagged:false, gps:null};
    }
    del[l.id] = rec;
  }
  S.del = del; S.pins = pins; LS.set(K_DEL, del); LS.set(K_PINS, pins); emit();
  toast("Added sample activity for " + n + " deliveries. It’s marked “sample” and has no photos.");
}

/* ===== sheet ===== */
let sheetRefresh = null, lastFocus = null;
function openSheet(html) {
  closeSheet(); lastFocus = document.activeElement;
  const root = $("#sheetroot");
  root.innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><button class="close" data-act="close-sheet" aria-label="Close">×</button><div class="sheet-body">${html}</div></div></div>`;
  const el = $(".sheet", root);
  $(".close", el).focus();
  return el;
}
function closeSheet() {
  const root = $("#sheetroot"); if (!root.firstChild) return;
  root.innerHTML = ""; sheetRefresh = null;
  if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {}
}

/* ===== actions ===== */
let clearArmed = false;
const ACT = {
  back, home: () => { V.stack = []; go("home", {}, false); },
  "role-mill": () => ME.mill && MILL_BY_SLUG[ME.mill] ? go("millHome", {mill:ME.mill}) : go("millPick"),
  "role-shop": () => ME.shop && SHOPS[ME.shop] ? go("shopHome", {shop:ME.shop}) : go("shopPick"),
  "role-board": () => go("board"),
  "pick-mill": d => { ME.mill = d.slug; saveMe(); go("millHome", {mill:d.slug}); },
  "change-mill": () => { delete ME.mill; saveMe(); go("millPick", {}, false); },
  "as-mill": d => { ME.mill = d.slug; saveMe(); go("millHome", {mill:d.slug}); },
  "pick-shop": d => { ME.shop = d.key; saveMe(); go("shopHome", {shop:d.key}); },
  "change-shop": () => { delete ME.shop; saveMe(); go("shopPick", {}, false); },
  offload: d => openOffload(d.id),
  detail: d => openDetail(d.id),
  "close-sheet": closeSheet,
  "confirm-ok": d => { const l = BY_ID[d.id]; const {o} = stateOf(l); doConfirm(l, {b10:o.b10, b20:o.b20, b15:o.b15, total:o.total}, "ok", false); },
  "confirm-diff": d => openConfirmDiff(d.id, false),
  "confirm-untagged": d => openConfirmDiff(d.id, true),
  "confirm-none": (d, el) => {
    if (el.dataset.armed) { doConfirm(BY_ID[d.id], {b10:0, b20:0, b15:0, total:0}, "none", false); return; }
    el.dataset.armed = "1"; el.textContent = "Tap again: nothing arrived"; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = "Nothing arrived"; } }, 4000);
  },
  pin: pinShop,
  dist: d => { V.dist = d.d; render(false); },
  sort: d => { V.sort = d.s; render(false); },
  bmill: d => go("bmill", {bmill:d.slug}),
  export: exportCsv,
  simulate,
  clear: (d, el) => {
    if (!clearArmed) { clearArmed = true; el.textContent = "Tap again to clear everything"; setTimeout(() => { clearArmed = false; if (el.isConnected) el.textContent = "Clear test data"; }, 4000); return; }
    clearArmed = false; clearAll();
  }
};
document.addEventListener("click", e => {
  if (e.target.matches("[data-scrim]")) { closeSheet(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset, el); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button][data-act]")) { e.preventDefault(); e.target.click(); }
});
setInterval(() => { if (V.name === "board" || V.name === "bmill") render(false); }, 60000);

/* ===== start ===== */
(async function start() {
  FONT_LINKS.forEach(h => { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = h; document.head.appendChild(l); });
  render(true);
  window.__tqBooted = true;
  await initStore();
  const h = (location.hash || "").replace(/^#/, "");
  if (h === "mill") ACT["role-mill"]();
  else if (h === "shop") ACT["role-shop"]();
  else if (h === "board") ACT["role-board"]();
  else if (h.startsWith("m-") && MILL_BY_SLUG[h.slice(2)]) { ME.mill = h.slice(2); saveMe(); go("millHome", {mill:ME.mill}); }
  else render(true);
})();
</script>
